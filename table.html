<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Basic HTML Table Practice</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse; /* Merges borders into a single line */
        }
        th, td {
            border: 1px solid #dddddd;
            text-align: left;
            padding: 8px;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

    <h2>Employee Directory</h2>
    <table>
        <tr>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Role</th>
        </tr>
        <tr>
            <td>Jane</td>
            <td>Doe</td>
            <td>Software Engineer</td>
        </tr>
        <tr>
            <td>John</td>
            <td>Smith</td>
            <td>Project Manager</td>
        </tr>
        <tr>
            <td>Alex</td>
            <td>Jones</td>
            <td>UX Designer</td>
        </tr>
    </table>

</body>
</html>
